<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Orçamento · Fazzani Personal Chef</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{
      --g:#c9a54b;--gl:#ecd28a;--gd:#8f7535;--line:#3b2f14;--bg:#000;--sheet:#0a0a0a;
      --shadow: rgba(0,0,0,.5);
      box-sizing:border-box;
      padding-top:env(safe-area-inset-top,0px);
      padding-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{background:#000;scroll-padding-top:env(safe-area-inset-top,0px)}
    body{
      min-height:100vh;background:radial-gradient(ellipse 80% 40% at 50% 0,#1a1406,#000 70%) fixed;
      color:var(--g);font-family:'Manrope',sans-serif;
    }
    button, input{font:inherit}
    [hidden]{display:none!important}
    #printRoot{display:none}
    .bar{position:sticky;top:0;z-index:30;background:rgba(0,0,0,.96);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .bar b{color:var(--gl);font:600 15px 'Fraunces',serif;margin-right:auto}
    .btn{border:1px solid var(--gd);background:transparent;color:var(--gl);border-radius:6px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
    .btn:hover{background:#1a1406}
    .btn.pri{background:linear-gradient(180deg,var(--gl),var(--g));color:#000;border-color:var(--gl)}
    .btn:disabled{opacity:.6;cursor:wait}
    .msg{width:100%;font-size:11.5px;color:var(--gd);min-height:14px}
    .wrap{padding:24px 12px 60px}
    .sheet{position:relative;max-width:794px;margin:0 auto;padding:46px 52px 36px;background:var(--sheet);border:1px solid var(--gd);box-shadow:0 30px 70px var(--shadow);overflow:hidden}
    .sheet>*{position:relative;z-index:1}
    .sheet > .wm{position:absolute;inset:0;z-index:0;background-position:center 160px;background-repeat:repeat-y;background-size:480px auto;opacity:.06;pointer-events:none}
    .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
    .hd .co{display:flex;align-items:center;gap:16px;flex:1}
    .hd img{width:120px;height:100px;object-fit:contain;flex:none}
    .hd .cn{font:600 17px 'Fraunces',serif;color:var(--gl);letter-spacing:.5px}
    .hd .cs{font-size:10.5px;color:var(--gd);letter-spacing:.4px}
    .hd .qt{text-align:right}
    .hd .h1{font:600 30px 'Fraunces',serif;letter-spacing:6px;text-transform:uppercase;color:var(--gl);line-height:1.1}
    .mt{margin-top:8px;font-size:11px;color:var(--gd);display:grid;grid-template-columns:auto auto;gap:1px 12px;justify-content:end}
    .mt b{color:var(--g);font-weight:600;text-align:right}
    .rule{height:1px;background:var(--g);margin:22px 0 0;box-shadow:0 3px 0 -0px #0a0a0a,0 4px 0 var(--line)}
    .lead{margin-top:20px;font-size:13px;color:#dcc27a}
    .ed{outline:none;min-height:1.4em;border-radius:2px;white-space:pre-wrap;word-break:break-word}
    .ed:hover{background:rgba(201,165,75,.05)}
    .ed:focus{background:rgba(201,165,75,.09);box-shadow:0 0 0 1px var(--gd)}
    .ed:empty::before{content:attr(data-ph);color:#5f4f25}
    h2.st{font:600 11px 'Manrope';color:var(--gl);text-transform:uppercase;letter-spacing:2.2px;margin:0 0 10px;display:flex;align-items:center;gap:12px}
    h2.st::after{content:"";flex:1;height:1px;background:var(--line)}
    .sec,.fs{margin-top:26px;position:relative}
    .panel{border:1px solid var(--line);padding:14px 16px}
    .g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 28px}
    .f{position:relative}
    .f .lb{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gd);font-weight:600}
    .f .v{padding:1px 2px;color:var(--gl)}
    .x{background:none;border:none;color:var(--gd);cursor:pointer;font-size:15px;line-height:1}
    .x:hover{color:#fff}
    .f .x{position:absolute;right:0;top:-2px;font-size:13px}
    .sec > .x{position:absolute;right:0;top:-6px;font-size:10.5px}
    .add{margin-top:8px;background:none;border:1px dashed var(--gd);color:var(--gd);border-radius:4px;padding:6px 12px;font-size:11.5px;font-weight:600;cursor:pointer;margin-right:6px}
    .add:hover{color:var(--gl);border-color:var(--gl)}
    .tw{overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:520px}
    th{color:var(--g);font:600 9.5px 'Manrope';letter-spacing:1.6px;text-transform:uppercase;padding:9px 8px;text-align:left;border-top:1px solid var(--g);border-bottom:1px solid var(--g)}
    td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
    tbody tr:nth-child(even) td{background:rgba(201,165,75,.035)}
    .n{text-align:right;white-space:nowrap}
    .sum{width:340px;max-width:100%;margin:18px 0 0 auto}
    .sum .r{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--gd)}
    .sum .r b{color:var(--g);font-weight:600}
    .grand{border:1px solid var(--g);background:linear-gradient(180deg,#14100a,#0a0a0a);padding:13px 16px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;font:600 19px 'Fraunces',serif}
    .sign{display:flex;gap:56px;margin-top:54px}
    .sign .ed{flex:1;text-align:center;border-top:1px solid var(--g);padding-top:6px;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gd)}
    .ft{margin-top:30px;padding-top:12px;border-top:1px solid var(--g);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--gd);text-align:center}
    .ft .ed{flex:1;min-width:150px}
    .sheet input{font:inherit;color:var(--gl);background:rgba(201,165,75,.07);border:1px solid var(--line);border-radius:3px;padding:5px 7px;width:100%;text-align:right;outline:none}
    .sheet input:focus{border-color:var(--g);background:rgba(201,165,75,.12)}
    .sum .r input{width:84px;flex:none}
    .sum .r .lab{flex:1}
    .sum .r b{min-width:96px;text-align:right}
    .tt{font-weight:600;color:var(--gl)}
    .sheet.pdf{width:794px;max-width:none;border:0;box-shadow:none}
    .sheet.pdf .ed:hover{background:none}
    .sheet.pdf .ed:empty::before{content:none}
    #pv{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    #pv .tb{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
    #pv .tb b{color:var(--gl);font:600 15px 'Fraunces',serif;margin-right:auto}
    #pv .sc{flex:1;overflow:auto;padding:18px 10px}
    #pv .fr{margin:0 auto;position:relative}
    #pv .fr .sheet{position:absolute;left:0;top:0;transform-origin:top center;margin:0}
    @media(max-width:640px){
      .sheet{padding:26px 16px}
      .g{grid-template-columns:1fr}
      .hd{flex-direction:column}
      .hd .qt{text-align:left}
      .mt{justify-content:start}
    }
    @media print{
      @page{margin:0}
      html,body{background:#000!important}
      .app,#pv{display:none!important}
      #printRoot{display:block!important}
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .sheet{box-shadow:none;border:none}
    }
  </style>
</head>
<body>
  <div id="pv" hidden>
    <div class="tb">
      <b>Pré-visualização</b>
      <button class="btn pri" id="dlBtn" type="button">Baixar PDF</button>
      <button class="btn" id="prBtn" type="button">Imprimir</button>
      <button class="btn" id="clBtn" type="button">Fechar</button>
    </div>
    <div class="sc">
      <div id="fr" class="fr"></div>
    </div>
  </div>

  <div class="app">
    <div class="bar">
      <b>Gerador de Orçamento</b>
      <button class="btn pri" id="pvBtn" type="button">Pré-visualizar</button>
      <button class="btn" id="resetBtn" type="button">Novo</button>
      <div class="msg" id="msg" role="status">Tudo é editável: clique em qualquer texto. Salvo automaticamente neste aparelho.</div>
    </div>
    <div class="wrap">
      <div class="sheet" id="sheet"></div>
    </div>
  </div>

  <div id="printRoot"></div>

  <script>
    (function () {
      'use strict';

      const sheet = document.getElementById('sheet');
      const msg = document.getElementById('msg');
      const KEY = 'orcamento_dourado_v5';
      const PLACE = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500"><rect width="600" height="500" fill="#0a0a0a"/><circle cx="300" cy="250" r="165" fill="none" stroke="#c9a54b" stroke-width="12"/><path d="M160 330 C190 220, 230 170, 300 170 C360 170, 405 220, 440 330" fill="none" stroke="#c9a54b" stroke-width="12" stroke-linecap="round"/><path d="M230 245 L300 150 L370 245" fill="none" stroke="#ecd28a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="300" r="22" fill="#c9a54b"/></svg>'
      );

      function E(ph, txt, cls) {
        return '<div class="ed ' + (cls || '') + '" contenteditable="true" data-ph="' + ph + '">' + (txt || '') + '</div>';
      }

      function field(labelText, valueText) {
        return '<div class="f">' + E('Rótulo', labelText, 'lb') + E('Preencher', valueText, 'v') + '<button class="x no-export" data-act="delf" type="button" title="Remover campo">&times;</button></div>';
      }

      function I(cls, value, placeholder, typeName) {
        return '<input class="' + cls + '" data-t="' + (typeName || 'x') + '" type="text" inputmode="decimal" autocomplete="off" placeholder="' + placeholder + '" value="' + (value || '') + '">';
      }

      function row(description, qty, unit) {
        return '<tr><td>' + E('Descrição do item', description) + '</td><td class="n">' + I('q', qty, '1', 'q') + '</td><td class="n">' + I('u', unit, '0,00', 'm') + '</td><td class="n t tt">—</td><td class="no-export"><button class="x no-export" data-act="delr" type="button">&times;</button></td></tr>';
      }

      function SR(labelText, inputMarkup, id, opt) {
        return '<div class="r"' + (opt ? ' data-opt="' + opt + '"' : '') + '>' + E('Rótulo', labelText, 'lab') + inputMarkup + '<b id="' + id + '">—</b></div>';
      }

      function sec(title, bodyText) {
        return '<div class="sec blk"><button class="x no-export" data-act="dels" type="button">&times; remover seção</button><h2 class="st ed" contenteditable="true" data-ph="Título da seção">' + (title || 'Nova seção') + '</h2><div class="body ed" contenteditable="true" data-ph="Texto da seção">' + (bodyText || '') + '</div></div>';
      }

      function dt(date) {
        return date.toLocaleDateString('pt-BR');
      }

      function MT(labelText, valueText) {
        return '<span>' + labelText + '</span><b class="ed" contenteditable="true" data-ph="—">' + valueText + '</b>';
      }

      function tpl() {
        const d = new Date();
        const v = new Date(d); v.setDate(v.getDate() + 15);

        return '<div class="wm" style="background-image:url(\'' + PLACE + '\')"></div>' +
          '<div class="hd"><div class="co"><img id="logo" src="' + PLACE + '" alt="Logo"><div>' + E('Nome da empresa', 'Fazzani', 'cn') + E('Slogan ou segmento', 'Personal Chef', 'cs') + E('Contato', '+41 76 804 95 72 · jfazzani.eng@gmail.com', '') + '</div></div>' +
          '<div class="qt">' + E('Título', 'Orçamento', 'h1') + '<div class="mt">' + MT('Nº', '001') + MT('Emissão', dt(d)) + MT('Validade', dt(v)) + '</div></div></div>' +
          '<div class="rule"></div>' +
          '<div class="lead blk">' + E('Texto de apresentação', 'Prezado cliente, agradecemos o seu interesse. Segue abaixo a nossa proposta, elaborada de acordo com as suas necessidades.', '') + '</div>' +
          '<div class="fs blk"><h2 class="st ed" contenteditable="true">Dados do cliente</h2><div class="panel"><div class="g" id="fields">' + field('Cliente', '') + field('Telefone / WhatsApp', '') + field('E-mail', '') + field('Localidade', '') + '</div></div></div>' +
          '<div id="secs">' + sec('Escopo do serviço', 'Descreva aqui o que está incluído na proposta.') + '</div>' +
          '<button class="add no-export" data-act="adds" type="button">+ Seção de texto</button>' +
          '<div class="fs blk"><h2 class="st ed" contenteditable="true">Investimento</h2><div class="tw"><table><thead><tr><th>Descrição</th><th class="n" style="width:10%">Qtd</th><th class="n" style="width:18%">Valor unit.</th><th class="n" style="width:18%">Total</th><th class="no-export" style="width:26px"></th></tr></thead><tbody id="tb">' + row('Café e prova', '1', '0,00') + row('Menu do evento', '1', '0,00') + '</tbody></table></div></div>' +
          '<div class="sum blk"><div class="r"><span class="ed lab" contenteditable="true">Subtotal</span><b id="sSub">—</b></div>' +
          SR('Desconto (%)', I('dp', '', '0', 'p'), 'aDp', 'dp') +
          SR('Desconto (valor)', I('dv', '', '0,00', 'm'), 'aDv', 'dv') +
          SR('Taxa / deslocamento', I('ex', '', '0,00', 'm'), 'aEx', 'ex') +
          SR('Imposto / IVA (%)', I('tx', '', '0', 'p'), 'aTx', 'tx') +
          '<div class="grand"><span class="ed" contenteditable="true">Total</span><span id="sTot">—</span></div>' +
          SR('Entrada / sinal (%)', I('en', '', '50', 'p'), 'aEn', 'en') + '<div class="r" data-opt="dep"><span class="ed lab" contenteditable="true">Saldo restante</span><b id="aSd">—</b></div>' +
          '<div class="r no-export"><span class="lab">Moeda (símbolo)</span><input class="cur" data-t="c" type="text" value="CHF"></div></div>' +
          '<div id="secs2">' + sec('Condições de pagamento', '50% na confirmação e 50% na entrega.') + '</div>' +
          '<button class="add no-export" data-act="adds2" type="button">+ Seção de texto</button>' +
          '<div class="sign blk">' + E('Assinatura', 'Fazzani', '') + E('Assinatura', 'Cliente', '') + '</div>' +
          '<div class="ft blk">' + E('Rodapé', 'Fazzani · Personal Chef', '') + E('Rodapé', 'WhatsApp +41 76 804 95 72', '') + E('Rodapé', 'jfazzani.eng@gmail.com', '') + '</div>';
      }

      function num(value) {
        if (value === null || value === undefined) return 0;
        const s = String(value).replace(/[\s'’]/g, '').replace(/[^\d.,-]/g, '');
        if (s.includes(',') && s.includes('.')) return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
        return parseFloat(s.replace(',', '.')) || 0;
      }

      function cur() {
        const input = document.querySelector('.cur', sheet);
        return input ? (input.value.trim() || '') : '';
      }

      function fmt(value) {
        const currency = cur();
        return (currency + ' ' + Number(value).toLocaleString('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })).trim();
      }

      function V(className) {
        const input = sheet.querySelector('.' + className);
        return input ? num(input.value) : 0;
      }

      function calc() {
        let sub = 0;
        const rows = sheet.querySelectorAll('#tb tr');
        rows.forEach(function (tr) {
          const qInput = tr.querySelector('.q');
          const uInput = tr.querySelector('.u');
          const qty = qInput && qInput.value.trim() !== '' ? num(qInput.value) : 1;
          const unit = uInput ? num(uInput.value) : 0;
          const total = qty * unit;
          sub += total;
          const totalCell = tr.querySelector('.t');
          if (totalCell) totalCell.textContent = fmt(total);
        });

        const dp = sub * V('dp') / 100;
        const dv = V('dv');
        const base = Math.max(0, sub - dp - dv);
        const ex = V('ex');
        const tb = base + ex;
        const tx = tb * V('tx') / 100;
        const tot = tb + tx;
        const en = tot * V('en') / 100;

        const setValue = function (id, value, negative) {
          const node = document.getElementById(id);
          if (!node) return;
          node.textContent = value ? ((negative ? '− ' : '') + fmt(value)) : '—';
        };

        document.getElementById('sSub').textContent = fmt(sub);
        setValue('aDp', dp, true);
        setValue('aDv', Math.min(dv, Math.max(sub - dp, 0)), true);
        setValue('aEx', ex, false);
        setValue('aTx', tx, false);
        document.getElementById('sTot').textContent = fmt(tot);
        setValue('aEn', en, false);
        document.getElementById('aSd').textContent = fmt(tot - en);
      }

      function save() {
        try { localStorage.setItem(KEY, sheet.innerHTML); } catch (e) {}
      }

      function setMsg(value) {
        msg.textContent = value;
      }

      function buildStatic() {
        const clone = sheet.cloneNode(true);
        clone.removeAttribute('id');
        clone.classList.add('pdf');

        clone.querySelectorAll('.r[data-opt]').forEach(function (rowEl) {
          const opt = rowEl.dataset.opt;
          const input = opt === 'dep' ? clone.querySelector('.en') : rowEl.querySelector('input');
          if (!input || !num(input.value)) rowEl.remove();
        });

        clone.querySelectorAll('.no-export').forEach(function (node) {
          node.remove();
        });

        clone.querySelectorAll('input').forEach(function (input) {
          const type = input.dataset.t;
          const value = input.value.trim();
          const span = document.createElement('span');
          span.textContent = type === 'p' ? (value ? num(value) + '%' : '') :
            type === 'm' ? (value ? num(value).toLocaleString('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '—') :
            (value || '1');
          if (input.closest('.sum')) {
            span.style.cssText = 'min-width:50px;text-align:right;color:#c9a54b';
          }
          input.replaceWith(span);
        });

        clone.querySelectorAll('[contenteditable]').forEach(function (el) {
          el.removeAttribute('contenteditable');
        });

        clone.querySelectorAll('.ed:empty').forEach(function (el) {
          el.style.minHeight = '0';
        });

        return clone;
      }

      function fitPreview() {
        const fr = document.getElementById('fr');
        const c = fr && fr.firstElementChild;
        if (!c) return;
        const scale = Math.min(1, (window.innerWidth - 24) / 794);
        c.style.transform = 'scale(' + scale + ')';
        c.style.transformOrigin = 'top center';
        fr.style.width = (794 * scale) + 'px';
        fr.style.height = (c.offsetHeight * scale) + 'px';
      }

      function preview() {
        const fr = document.getElementById('fr');
        const pv = document.getElementById('pv');
        if (!fr || !pv) return;
        fr.innerHTML = '';
        const clone = buildStatic();
        clone.classList.add('pdf');
        fr.appendChild(clone);
        pv.hidden = false;
        document.body.style.overflow = 'hidden';
        fitPreview();
      }

      function downloadPdf() {
        const root = buildStatic();
        root.classList.add('pdf');

        const stage = document.createElement('div');
        stage.style.position = 'fixed';
        stage.style.left = '-9999px';
        stage.style.top = '0';
        stage.style.width = '794px';
        stage.style.zIndex = '1';
        stage.appendChild(root);
        document.body.appendChild(stage);

        const wait = function () {
          return new Promise(function (resolve) {
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(resolve).catch(resolve);
            } else {
              resolve();
            }
          });
        };

        wait().then(function () {
          if (!window.html2canvas || !window.jspdf) {
            throw new Error('Bibliotecas de PDF não carregadas');
          }
          return html2canvas(root, { scale: 2, useCORS: true, backgroundColor: '#0a0a0a', logging: false });
        }).then(function (canvas) {
          const { jsPDF } = window.jspdf;
          const imgData = canvas.toDataURL('image/png');
          const pdf = new jsPDF('p', 'mm', 'a4');
          const pageWidth = 210;
          const pageHeight = 297;
          const margin = 12;
          const imgWidth = pageWidth - margin * 2;
          const ratio = canvas.width / canvas.height;
          let imgHeight = imgWidth / ratio;
          if (imgHeight > pageHeight - margin * 2) {
            imgHeight = pageHeight - margin * 2;
          }
          pdf.addImage(imgData, 'PNG', margin, margin, imgWidth, imgHeight, undefined, 'FAST');
          pdf.save('orcamento.pdf');
          setMsg('PDF baixado: orcamento.pdf');
        }).catch(function (error) {
          console.error(error);
          setMsg('Não foi possível gerar o PDF. Use "Imprimir" e escolha Salvar como PDF.');
        }).finally(function () {
          stage.remove();
        });
      }

      function init() {
        let saved = null;
        try {
          saved = localStorage.getItem(KEY);
        } catch (e) {}

        if (saved && saved.includes('class="cur"') && saved.includes('class="en"')) {
          sheet.innerHTML = saved;
        } else {
          sheet.innerHTML = tpl();
        }

        calc();
      }

      sheet.addEventListener('input', function (event) {
        const target = event.target;
        if (target.tagName === 'INPUT') {
          target.setAttribute('value', target.value);
        }
        calc();
        save();
      });

      sheet.addEventListener('paste', function (event) {
        const el = event.target.closest && event.target.closest('.ed');
        if (!el) return;
        event.preventDefault();
        const text = (event.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, text);
      });

      sheet.addEventListener('keydown', function (event) {
        const target = event.target;
        if (event.key === 'Enter' && target.closest && target.closest('.ed') && !target.closest('.body,.lead') && !event.shiftKey) {
          event.preventDefault();
        }
      });

      sheet.addEventListener('click', function (event) {
        const button = event.target.closest('[data-act]');
        if (!button) return;
        const action = button.dataset.act;

        if (action === 'delf') {
          button.closest('.f').remove();
        } else if (action === 'delr') {
          button.closest('tr').remove();
        } else if (action === 'dels') {
          button.closest('.sec').remove();
        } else if (action === 'adds') {
          document.getElementById('secs').insertAdjacentHTML('beforeend', sec('Nova seção', ''));
        } else if (action === 'adds2') {
          document.getElementById('secs2').insertAdjacentHTML('beforeend', sec('Nova seção', ''));
        }

        calc();
        save();
      });

      document.getElementById('pvBtn').addEventListener('click', preview);
      document.getElementById('dlBtn').addEventListener('click', downloadPdf);
      document.getElementById('prBtn').addEventListener('click', function () {
        const root = document.getElementById('printRoot');
        root.innerHTML = '';
        const clone = buildStatic();
        clone.style.minHeight = '0';
        root.appendChild(clone);
        window.print();
      });
      document.getElementById('clBtn').addEventListener('click', function () {
        document.getElementById('pv').hidden = true;
        document.getElementById('fr').innerHTML = '';
        document.body.style.overflow = '';
      });
      document.getElementById('resetBtn').addEventListener('click', function () {
        if (!confirm('Começar um novo orçamento? O conteúdo atual será apagado.')) return;
        try { localStorage.removeItem(KEY); } catch (e) {}
        sheet.innerHTML = tpl();
        calc();
        save();
      });

      window.addEventListener('resize', fitPreview);
      window.addEventListener('afterprint', function () {
        document.getElementById('printRoot').innerHTML = '';
      });

      init();
    })();
  </script>
</body>
</html>
