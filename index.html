<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Orçamento · Fazzani Personal Chef</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--g:#c9a54b;--gl:#ecd28a;--gd:#8f7535;--line:#3b2f14;--bg:#000;--sheet:#0a0a0a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
*{margin:0;padding:0;box-sizing:inherit}
body{background:radial-gradient(ellipse 80% 40% at 50% 0,#1a1406,#000 70%) fixed;color:var(--g);font-family:'Manrope',sans-serif}
button{font-family:inherit}
[hidden]{display:none!important}
#printRoot{display:none}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(0,0,0,.95);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar b{color:var(--gl);font:600 15px 'Fraunces',serif;margin-right:auto}
.btn{border:1px solid var(--gd);background:transparent;color:var(--gl);border-radius:6px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:#1a1406}
.btn.pri{background:linear-gradient(180deg,var(--gl),var(--g));color:#000;border-color:var(--gl)}
.btn:disabled{opacity:.6;cursor:wait}
.msg{width:100%;font-size:11.5px;color:var(--gd);min-height:14px}
.wrap{padding:24px 12px 60px}
.sheet{position:relative;background:var(--sheet);max-width:794px;margin:0 auto;padding:46px 52px 36px;font-size:12.5px;line-height:1.6;border:1px solid var(--gd);box-shadow:0 30px 70px #000;overflow:hidden}
.sheet>*{position:relative;z-index:1}
.sheet>.wm{position:absolute;inset:0;z-index:0;background-position:center 160px;background-repeat:repeat-y;background-size:480px auto;opacity:.05;pointer-events:none}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.hd .co{display:flex;gap:16px;align-items:center;flex:1}
.hd img{width:120px;height:100px;object-fit:contain;flex:none}
.hd .cn{font:600 17px 'Fraunces',serif;color:var(--gl);letter-spacing:.5px}
.hd .cs{font-size:10.5px;color:var(--gd);letter-spacing:.4px}
.hd .qt{text-align:right}
.hd .h1{font:600 30px 'Fraunces',serif;letter-spacing:6px;text-transform:uppercase;color:var(--gl);line-height:1.1}
.mt{margin-top:8px;font-size:11px;color:var(--gd);display:grid;grid-template-columns:auto auto;gap:1px 12px;justify-content:end}
.mt b{color:var(--g);font-weight:600;text-align:right}
.rule{height:1px;background:var(--g);margin:22px 0 0;box-shadow:0 3px 0 -0px #0a0a0a,0 4px 0 var(--line)}
.ed{outline:none;min-height:1.4em;border-radius:2px;white-space:pre-wrap;word-break:break-word}
.ed:hover{background:rgba(201,165,75,.05)}
.ed:focus{background:rgba(201,165,75,.09);box-shadow:0 0 0 1px var(--gd)}
.ed:empty::before{content:attr(data-ph);color:#5f4f25}
.lead{margin-top:20px;font-size:13px;color:#dcc27a}
h2.st{font:600 11px 'Manrope';color:var(--gl);text-transform:uppercase;letter-spacing:2.2px;margin:0 0 10px;display:flex;align-items:center;gap:12px}
h2.st::after{content:"";flex:1;height:1px;background:var(--line)}
.sec,.fs{margin-top:26px;position:relative}
.sec .body{padding:2px}
.panel{border:1px solid var(--line);padding:14px 16px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 28px}
.f{position:relative}
.f .lb{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gd);font-weight:600}
.f .v{padding:1px 2px;color:var(--gl)}
.x{background:none;border:none;color:var(--gd);cursor:pointer;font-size:15px;line-height:1}
.x:hover{color:#fff}
.f .x{position:absolute;right:0;top:-2px;font-size:13px}
.sec>.x{position:absolute;right:0;top:-6px;font-size:10.5px}
.add{margin-top:8px;background:none;border:1px dashed var(--gd);color:var(--gd);border-radius:4px;padding:6px 12px;font-size:11.5px;font-weight:600;cursor:pointer;margin-right:6px}
.add:hover{color:var(--gl);border-color:var(--gl)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th{color:var(--g);font:600 9.5px 'Manrope';letter-spacing:1.6px;text-transform:uppercase;padding:9px 8px;text-align:left;border-top:1px solid var(--g);border-bottom:1px solid var(--g)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even) td{background:rgba(201,165,75,.035)}
.n{text-align:right;white-space:nowrap}
.sum{width:340px;max-width:100%;margin:18px 0 0 auto}
.sum .r{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--gd)}
.sum .r b{color:var(--g);font-weight:600}
.sum .r .a{text-align:right;min-width:90px;color:var(--g)}
.grand{border:1px solid var(--g);background:linear-gradient(180deg,#14100a,#0a0a0a);padding:13px 16px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;font:600 19px 'Fraunces',serif;color:var(--gl);letter-spacing:.5px}
.sign{display:flex;gap:56px;margin-top:54px}
.sign .ed{flex:1;text-align:center;border-top:1px solid var(--g);padding-top:6px;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gd)}
.ft{margin-top:30px;padding-top:12px;border-top:1px solid var(--g);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--gd);text-align:center}
.ft .ed{flex:1;min-width:150px}
.sheet input{font:inherit;color:var(--gl);background:rgba(201,165,75,.07);border:1px solid var(--line);border-radius:3px;padding:5px 7px;width:100%;text-align:right;outline:none}
.sheet input:focus{border-color:var(--g);background:rgba(201,165,75,.12)}
.sheet input::placeholder{color:#5f4f25}
.sum .r input{width:84px;flex:none}
.sum .r .lab{flex:1}
.sum .r b{min-width:96px;text-align:right}
.tt{font-weight:600;color:var(--gl)}
.sheet.pdf{width:794px;max-width:none;border:0;box-shadow:none}
.sheet.pdf .ed:hover{background:none}
.sheet.pdf .ed:empty::before{content:none}
#pv{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#pv .tb{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#pv .tb b{color:var(--gl);font:600 15px 'Fraunces',serif;margin-right:auto}
#pv .sc{flex:1;overflow:auto;padding:18px 10px}
#pv .fr{margin:0 auto;position:relative}
#pv .fr .sheet{position:absolute;left:0;top:0;transform-origin:0 0;margin:0}
@media(max-width:640px){.sheet{padding:26px 16px}.g{grid-template-columns:1fr}.hd{flex-direction:column}.hd .qt{text-align:left}.mt{justify-content:start}}
@media print{@page{margin:0}html,body{background:#000!important}.app{display:none!important}#printRoot{display:block!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.blk,tr,.sign{break-inside:avoid}}
</style>
</head>
<body>
<div id="pv" hidden><div class="tb"><b>Pré-visualização</b><button class="btn pri" id="dlBtn" type="button">Baixar PDF</button><button class="btn" id="prBtn" type="button">Imprimir</button><button class="btn" id="clBtn" type="button">Fechar</button></div><div class="sc"><div class="fr" id="fr"></div></div></div>
<div class="app">
<div class="bar">
  <b>Gerador de Orçamento</b>
  <button class="btn pri" id="pvBtn" type="button">Pré-visualizar</button>
  <button class="btn" id="resetBtn" type="button">Novo</button>
  <div class="msg" id="msg" role="status">Tudo é editável: clique em qualquer texto. Salvo automaticamente neste aparelho.</div>
</div>
<div class="wrap"><div class="sheet" id="sheet"></div></div>
</div>
<div id="printRoot"></div>

function getLogo(){return PLACE}
function num(s){s=String(s).replace(/[\s'’]/g,'').replace(/[^\d.,-]/g,'');if(s.indexOf(',')>-1&&s.indexOf('.')>-1)s=s.replace(/\./g,'');return parseFloat(s.replace(',','.'))||0}
function cur(){return ($('.cur',sheet).value.trim()||'')}
function fmt(n){return (cur()+' '+n.toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2})).trim()}
function V(c){return num($('.'+c,sheet).value)}
function calc(){
 var sub=0;
 sheet.querySelectorAll('#tb tr').forEach(function(tr){var q=$('.q',tr).value.trim()===''?1:num($('.q',tr).value);var t=q*num($('.u',tr).value);sub+=t;$('.t',tr).textContent=fmt(t)});
 var dp=sub*V('dp')/100,dv=V('dv'),base=Math.max(0,sub-dp-dv),ex=V('ex'),tb=base+ex,tx=tb*V('tx')/100,tot=tb+tx,en=tot*V('en')/100;
 function S(id,n,neg){$('#'+id).textContent=n?(neg?'− ':'')+fmt(n):'—'}
 $('#sSub').textContent=fmt(sub);S('aDp',dp,1);S('aDv',Math.min(dv,sub-dp>0?sub-dp:0),1);S('aEx',ex);S('aTx',tx);
 $('#sTot').textContent=fmt(tot);S('aEn',en);$('#aSd').textContent=fmt(tot-en);
}
function save(){try{localStorage.setItem(KEY,sheet.innerHTML)}catch(e){}}
function setMsg(t){msg.textContent=t}
function setLogo(u){try{localStorage.setItem(KEYL,u)}catch(e){}$('#logo',sheet).src=u;$('.wm',sheet).style.backgroundImage='url("'+u+'")';calc();save()}
function init(){var s=null;try{s=localStorage.getItem(KEY)}catch(e){}if(s&&(s.indexOf('class="cur"')<0||s.indexOf('class="en"')<0))s=null;sheet.innerHTML=s||tpl();calc()}
sheet.addEventListener('input',function(e){var t=e.target;if(t.tagName==='INPUT')t.setAttribute('value',t.value);calc();save()});
sheet.addEventListener('paste',function(e){var el=e.target.closest&&e.target.closest('.ed');if(!el)return;e.preventDefault();var t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t)});
sheet.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.closest&&e.target.closest('.ed')&&!e.target.closest('.body,.lead')&&!e.shiftKey){e.preventDefault()}});
sheet.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,h;
 if(a==='delf')b.closest('.f').remove();
 else if(a==='delr')b.closest('tr').remove();
 else if(a==='dels')b.closest('.sec').remove();
 else if(a==='addf')$('#fields',sheet).insertAdjacentHTML('beforeend',field('Novo campo',''));
 else if(a==='addr')$('#tb',sheet).insertAdjacentHTML('beforeend',row('','1','0'));
 else if(a==='adds')$('#secs',sheet).insertAdjacentHTML('beforeend',sec('Nova seção',''));
 else if(a==='adds2')$('#secs2',sheet).insertAdjacentHTML('beforeend',sec('Nova seção',''));
 calc();save();
});
function buildStatic(){
 var c=sheet.cloneNode(true);c.removeAttribute('id');c.classList.add('pdf');
 c.querySelectorAll('.r[data-opt]').forEach(function(r){var k=r.dataset.opt,i=k==='dep'?$('.en',c):$('input',r);if(!num(i.value))r.remove()});
 c.querySelectorAll('.no-export').forEach(function(x){x.remove()});
 c.querySelectorAll('input').forEach(function(i){var t=i.dataset.t,v=i.value.trim(),sp=document.createElement('span');
  sp.textContent=t==='p'?(v?num(v)+'%':''):t==='m'?(v?num(v).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'):(v||'1');
  if(i.closest('.sum'))sp.style.cssText='min-width:50px;text-align:right;color:#c9a54b';i.replaceWith(sp)});
 c.querySelectorAll('[contenteditable]').forEach(function(x){x.removeAttribute('contenteditable')});
 c.querySelectorAll('.ed:empty').forEach(function(x){x.style.minHeight='0'});
 return c;
}
function fname(){var n=($('.v',sheet)||{}).textContent||'';n=n.trim().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'');return 'Orcamento'+(n?'-'+n:'')+'.pdf'}
async function makePdf(btn){
 var old=btn.textContent;btn.disabled=true;btn.textContent='Gerando PDF…';
 var stage=document.createElement('div');stage.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#0a0a0a';
 var c=buildStatic();stage.appendChild(c);document.body.appendChild(stage);
 try{
  if(!window.html2pdf)throw 0;
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  var H=c.offsetHeight,P=1123;c.style.minHeight=(Math.ceil(H/P)*P)+'px';
  var blob=await html2pdf().set({margin:0,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#0a0a0a',windowWidth:794},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['.blk','tr','.sign']}}).from(c).outputPdf('blob');
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname();document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
  setMsg('PDF baixado: '+fname());
 }catch(e){setMsg('Não foi possível gerar o PDF. Use "Imprimir" e escolha Salvar como PDF.')}
 stage.remove();btn.disabled=false;btn.textContent=old;
}
function fit(){var fr=$('#fr'),c=fr.firstChild;if(!c)return;var k=Math.min(1,(window.innerWidth-24)/794);c.style.transform='scale('+k+')';fr.style.width=(794*k)+'px';fr.style.height=(c.offsetHeight*k)+'px'}
$('#pvBtn').onclick=function(){var fr=$('#fr');fr.innerHTML='';var c=buildStatic();fr.appendChild(c);$('#pv').hidden=false;document.body.style.overflow='hidden';fit()};
$('#clBtn').onclick=function(){$('#pv').hidden=true;$('#fr').innerHTML='';document.body.style.overflow=''};
window.addEventListener('resize',fit);
$('#dlBtn').onclick=function(){makePdf(this)};
$('#prBtn').onclick=function(){var r=$('#printRoot');r.innerHTML='';var c=buildStatic();c.style.minHeight='0';r.appendChild(c);window.print()};
window.addEventListener('afterprint',function(){$('#printRoot').innerHTML=''});
$('#resetBtn').onclick=function(){if(!confirm('Começar um novo orçamento? O conteúdo atual será apagado (o logo continua).'))return;try{localStorage.removeItem(KEY)}catch(e){}sheet.innerHTML=tpl();calc();setMsg('Novo orçamento criado (o logo foi mantido).')};
init();
})();
</script>
